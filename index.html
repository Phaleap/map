<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Tonlé Sap Map showing 3 conservation areas and 12 project local areas." />
    <title>ផែនទីបឹងទន្លេសាប · Tonlé Sap Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="map-header" role="banner">
      <div class="header-card">
        <h1 class="header-title-kh">ផែនទីបឹងទន្លេសាប</h1>
        <span class="header-title-en">TONLÉ SAP MAP</span>
      </div>
    </header>

    <div class="map-legend" role="complementary" aria-label="Map Legend">
      <div class="legend-row">
        <span class="legend-box area-swatch" aria-hidden="true"></span>
        <div class="legend-labels">
          <span class="legend-kh">តំបន់អភិរក្ស (៣)</span>
          <span class="legend-en">3 KBA Core Zones</span>
        </div>
      </div>
      <div class="legend-row">
        <span class="legend-circle point-swatch" aria-hidden="true"></span>
        <div class="legend-labels">
          <span class="legend-kh">តំបន់គោលដៅគម្រោង (១២)</span>
          <span class="legend-en">12 Project Sites</span>
        </div>
      </div>
    </div>

    <main id="map" role="main" aria-label="Tonlé Sap interactive map"></main>

    <section id="info-card" class="info-card" aria-live="polite" hidden>
      <button id="btn-close-info" type="button" aria-label="Close" class="info-close-btn">&times;</button>
      <h2 id="info-kh" class="info-khmer"></h2>
      <p id="info-en" class="info-english"></p>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/locations.js"></script>
    <script src="js/map.js"></script>
  </body>
</html>
